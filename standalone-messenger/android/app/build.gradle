plugins { id 'com.android.application' }

android {
    namespace 'br.com.contacto.signal.messenger'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.contacto.signal.messenger'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0-dev'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
